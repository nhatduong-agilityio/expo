name: Feature CD Build (EAS Local)

on:
  pull_request:
    branches: [expo-practice-one]
  push:
    branches: [expo-practice-one]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  ci-checks:
    name: Run CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Check Prettier formatting
        run: yarn format --check

      - name: TypeScript type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Run tests with coverage
        run: yarn test:coverage

  build-feature-android:
    name: EAS Local Build (Android Feature)
    runs-on: ubuntu-latest
    needs: ci-checks
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.platform == 'android' || inputs.platform == 'all'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Local Android requires SDK/Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: '35' # Expo SDK ~54

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: EAS Local Build Android
        run: eas build --platform android --profile feature --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-feature-eas
          path: |
            dist/*.apk
            dist/*.aab
          retention-days: 30

  build-feature-ios:
    name: EAS Local Build (iOS Feature)
    runs-on: macos-13
    needs: ci-checks
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.platform == 'ios' || inputs.platform == 'all'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Local Build iOS
        run: eas build --platform ios --profile feature --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-feature-eas
          path: |
            dist/*.ipa
          retention-days: 30

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [ci-checks, build-feature-android, build-feature-ios]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "✅ CI checks: ${{ needs.ci-checks.result }}"
          echo "🤖 Android: ${{ needs.build-feature-android.result }}"
          echo "📱 iOS: ${{ needs.build-feature-ios.result }}"
          echo ""
          echo "Download artifacts (APK/IPA) from Actions tab!"
