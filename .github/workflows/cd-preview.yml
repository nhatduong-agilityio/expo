name: Preview CD Build (EAS Local)

on:
  pull_request:
    branches: [expo-practice-one]
  push:
    branches: [expo-practice-one]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  ci-checks:
    name: Run CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Check Prettier formatting
        run: yarn format --check

      - name: TypeScript type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Run tests with coverage
        run: yarn test:coverage

  build-preview-android:
    name: EAS Local Build (Android Preview)
    runs-on: ubuntu-latest
    needs: ci-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Prebuild Android
        run: npx expo prebuild -p android --clean

      - name: EAS Local Build (Android)
        run: eas build --platform android --profile preview --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ./build-output

      - name: List APK/AAB
        run: |
          find build-output -name "*.apk" -type f || true
          find build-output -name "*.aab" -type f || true

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-${{ github.sha }}
          path: |
            ./build-output/**/*.apk
            ./build-output/**/*.aab
          retention-days: 30
          if-no-files-found: warn

  build-preview-ios:
    name: EAS Local Build (iOS Simulator Preview)
    runs-on: macos-14
    needs: ci-checks
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.platform == 'ios' || inputs.platform == 'all'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'yarn'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: brew install fastlane

      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.15.2

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Prebuild iOS project
        run: npx expo prebuild -p ios --clean

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: EAS Local Build (iOS Simulator)
        run: eas build --platform ios --profile preview --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ./build-output

      - name: Find simulator artifacts
        run: |
          echo "Looking for .app or .tar.gz files"
          find . -name "*.tar.gz" -type f
          find . -name "*.app" -type d

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ github.sha }}
          path: |
            ./build-output/*.tar.gz
            **/*.tar.gz

          retention-days: 30
          if-no-files-found: warn

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [ci-checks, build-preview-android, build-preview-ios]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CI checks: ${{ needs.ci-checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🤖 Android: ${{ needs.build-preview-android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 iOS: ${{ needs.build-preview-ios.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download artifacts from the Actions tab above!" >> $GITHUB_STEP_SUMMARY

          # Console output
          echo "✅ CI checks: ${{ needs.ci-checks.result }}"
          echo "🤖 Android: ${{ needs.build-preview-android.result }}"
          echo "📱 iOS: ${{ needs.build-preview-ios.result }}"
          echo ""
          echo "📦 Download artifacts (APK/IPA) from Actions tab!"
