name: Preview CD Build (EAS Local)

on:
  pull_request:
    branches: [expo-practice-one]
  push:
    branches: [expo-practice-one]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  ci-checks:
    name: Run CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Check Prettier formatting
        run: yarn format --check

      - name: TypeScript type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Run tests with coverage
        run: yarn test:coverage

  build-preview-android:
    name: EAS Local Build (Android Preview)
    runs-on: ubuntu-latest
    needs: ci-checks
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.platform == 'android' || inputs.platform == 'all'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: EAS Local Build Android
        run: eas build --platform android --profile preview --local --non-interactive --output ./build-output/app.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ./build-output

      - name: Find and list APK files
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" -type f
          ls -la *.apk 2>/dev/null || echo "No APK in root"
          ls -la ./build-output/ 2>/dev/null || echo "No build-output dir"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-${{ github.sha }}
          path: |
            ./*.apk
            ./*.aab
            ./build-output/*.apk
            ./build-output/*.aab
          retention-days: 30
          if-no-files-found: warn

  build-preview-ios:
    name: EAS Local Build (iOS preview)
    runs-on: macos-14 # macOS 14 = Xcode 15
    needs: ci-checks
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.platform == 'ios' || inputs.platform == 'all'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'yarn'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -v 1.15.2
          pod --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Local Build iOS
        run: eas build --platform ios --profile preview --local --non-interactive --output ./build-output/app.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ./build-output

      - name: Find and list IPA files
        run: |
          echo "Searching for IPA files..."
          find . -name "*.ipa" -type f
          ls -la *.ipa 2>/dev/null || echo "No IPA in root"
          ls -la ./build-output/ 2>/dev/null || echo "No build-output dir"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-preview-${{ github.sha }}
          path: |
            ./*.ipa
            ./*.app.tar.gz
            ./build-output/*.ipa
            ./build-output/*.app.tar.gz
          retention-days: 30
          if-no-files-found: warn

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [ci-checks, build-preview-android, build-preview-ios]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CI checks: ${{ needs.ci-checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🤖 Android: ${{ needs.build-preview-android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 iOS: ${{ needs.build-preview-ios.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download artifacts from the Actions tab above!" >> $GITHUB_STEP_SUMMARY

          # Console output
          echo "✅ CI checks: ${{ needs.ci-checks.result }}"
          echo "🤖 Android: ${{ needs.build-preview-android.result }}"
          echo "📱 iOS: ${{ needs.build-preview-ios.result }}"
          echo ""
          echo "📦 Download artifacts (APK/IPA) from Actions tab!"
